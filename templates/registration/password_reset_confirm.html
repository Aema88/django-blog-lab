{% extends 'base.html' %}

{% block content %}
    <h1>Новий пароль</h1>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Зберегти новий пароль</button>
        </form>
    {% else %}
        <p>Посилання для скидання пароля недійсне або вже було використане.</p>
    {% endif %}
{% endblock %}
